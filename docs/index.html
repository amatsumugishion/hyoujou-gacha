<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表情プロンプト保管庫</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>表情プロンプト保管庫</h1>
  <p class="sub">表情プロンプト×画像のガチャ＆一覧ツール</p>
</header>

<nav class="mode-switch">
  <button class="mode-btn active" data-mode="gacha">ガチャ</button>
  <button class="mode-btn" data-mode="list">一覧</button>
  <button class="mode-btn" data-mode="favorites">お気に入り</button>
</nav>

<main>

  <section id="gacha-view" class="view active">
    <div class="category-buttons" id="category-buttons"></div>
    <div class="composite-buttons" id="gacha-composite-buttons"></div>
    <div class="composite-buttons" id="gacha-part-buttons"></div>
    <button id="gacha-draw-btn" class="mode-btn gacha-draw-btn">ガチャを引く</button>

    <div class="gacha-result" id="gacha-result">
      <p class="placeholder">カテゴリを選んでガチャを引いてください</p>
    </div>
  </section>

  <section id="list-view" class="view">
    <div class="category-buttons" id="list-category-buttons"></div>
    <div class="composite-buttons" id="list-composite-buttons"></div>
    <div class="composite-buttons" id="list-part-buttons"></div>
    <div id="list-grid-container"></div>
  </section>

  <section id="favorites-view" class="view">
    <h2 class="section-heading">お気に入りガチャ</h2>
    <button id="favorites-gacha-btn" class="mode-btn gacha-draw-btn">ガチャを引く</button>
    <div class="gacha-result" id="favorites-gacha-result">
      <p class="placeholder">お気に入りからガチャを引けます</p>
    </div>

    <h2 class="section-heading">お気に入り一覧</h2>
    <div class="grid" id="favorites-grid"></div>
  </section>

</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <button class="modal-close" id="modal-close">×</button>
    <img id="modal-img" src="" alt="">
    <div id="modal-favorite"></div>
    <div id="modal-tags-row"></div>
    <div class="modal-tags" id="modal-tags-ja"></div>
    <div id="modal-note"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
